name: boundary-ci
on:
  push:
  pull_request:
jobs:
  credential-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm approve-builds workerd esbuild
      - run: pnpm --filter @wedding-rpg/web exec playwright install --with-deps chromium
      - run: node scripts/verify-ci.mjs
